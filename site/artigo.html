<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="titulo-aba">Diário Latino</title>
<link rel="icon" type="image/x-icon" href="diariolatino-logo-redondo.ico?v=2">
<link rel="shortcut icon" type="image/x-icon" href="diariolatino-logo-redondo.ico?v=2">
<link rel="apple-touch-icon" href="diariolatino-logo.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .materia { max-width: 760px; margin: 0 auto; padding: 36px 20px 10px; }
  .materia h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 38px;
    line-height: 1.15;
    color: var(--verde);
    margin: 14px 0 16px;
  }
  .materia .lead-materia { font-size: 18px; color: #3d3d38; margin-bottom: 18px; }
  .materia figure { margin: 0 0 22px; }
  .materia img { width: 100%; height: 380px; object-fit: cover; filter: grayscale(15%) contrast(1.05); }
  .materia .corpo { font-size: 17px; line-height: 1.75; white-space: pre-line; }
  .materia .voltar { display: inline-block; margin-bottom: 18px; font-size: 13px; color: var(--verde); }
  .rodape-materia {
    max-width: 760px;
    margin: 30px auto 0;
    padding: 18px 20px 0;
    border-top: 1px solid var(--linha);
    font-size: 11.5px;
    color: #8a8a80;
    line-height: 1.7;
  }
  .rodape-materia .selo-ia { font-style: italic; }
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <span class="edicao">Diário Latino</span>
  </div>
</div>

<header class="masthead">
  <div class="kicker">América Latina · Brics · Sul Global</div>
  <h1 style="font-size:38px;">
    <a href="index.html" style="color:inherit; display:inline-flex; align-items:center; gap:12px; justify-content:center;">
      <img src="diariolatino-logo.png" alt="" style="height:44px; width:auto;">
      Diário Latino
    </a>
  </h1>
</header>

<main class="wrap materia" id="materia">
  <p id="carregando">Carregando matéria...</p>
</main>

<footer>
  <div class="wrap">
    <div class="baixo">
      <span>© <span id="ano-copyright">2026</span> Diário Latino</span>
      <span>diariolatino.com.br</span>
      <span>Desenvolvido por <a href="https://hefezzia.com.br" style="border-bottom:1px dotted rgba(244,243,239,0.6);">Hefezzia</a></span>
    </div>
  </div>
</footer>

<script>
function figuraImagem(imagem) {
  if (!imagem) return "";
  return `<figure><img src="${imagem.url}" alt="">
    <figcaption class="credito-foto">Foto: <a href="${imagem.photographer_url}" target="_blank" rel="noopener">${imagem.photographer}</a> / <a href="${imagem.pexels_url}" target="_blank" rel="noopener">Pexels</a></figcaption></figure>`;
}

async function renderizarMateria() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const container = document.getElementById('materia');

  let artigos = [];
  try {
    const resp = await fetch('data/articles.json', { cache: 'no-store' });
    if (resp.ok) artigos = await resp.json();
  } catch (e) {
    console.error(e);
  }

  const artigo = artigos.find(a => a.id === id);
  if (!artigo) {
    container.innerHTML = '<p>Matéria não encontrada. <a href="index.html">Voltar para a home</a>.</p>';
    return;
  }

  document.getElementById('titulo-aba').textContent = artigo.titulo + ' — Diário Latino';
  container.innerHTML = `
    <a class="voltar" href="index.html">← Voltar para a home</a>
    <span class="selo">${artigo.categoria}</span>
    <h1>${artigo.titulo}</h1>
    ${figuraImagem(artigo.imagem)}
    <p class="lead-materia">${artigo.lead}</p>
    <div class="corpo">${artigo.corpo}</div>
    <div class="rodape-materia">
      <p class="selo-ia">${artigo.selo_ia}</p>
      <p>Fontes: ${artigo.fontes.join(' · ')}</p>
    </div>
  `;
}

renderizarMateria();
document.getElementById('ano-copyright').textContent = new Date().getFullYear();
</script>

</body>
</html>
