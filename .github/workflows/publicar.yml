name: Publicar notícias Diário Latino

on:
  workflow_dispatch: {}        # permite rodar manualmente pelo botão "Run workflow"
  schedule:
    - cron: "0 * * * *"        # roda automaticamente a cada hora cheia (UTC)

concurrency:
  group: publicar-noticias
  cancel-in-progress: false    # enfileira execuções sobrepostas em vez de rodar em paralelo

permissions:
  contents: write              # necessário pra o job poder commitar o articles.json de volta

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          USAR_EMBEDDING_CHECK: "false"
        run: python -m pipeline.main

      - name: Commitar novas notícias no repositório
        run: |
          git config user.name "diariolatino-bot"
          git config user.email "bot@diariolatino.local"
          git add site/data/*.json
          if git diff --cached --quiet; then
            echo "Nada para commitar."
            exit 0
          fi
          git commit -m "Atualiza notícias [automático]"
          for tentativa in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push rejeitado (tentativa $tentativa/5) — outra execução deve ter" \
                 "commitado ao mesmo tempo. Tentando de novo em 5s..."
            sleep 5
          done
          echo "Não foi possível dar push depois de 5 tentativas." >&2
          exit 1
